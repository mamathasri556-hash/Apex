<template>

    <div class="main-container">

        <div class="chatbot-container">

            <!-- Header -->
            <div class="chatbot-header">
                <div class="top-bar">

                    <img src={whatsappIcon}
                         alt="WhatsApp"
                         class="whatsapp-icon"/>

                    <span>{recordName}</span>

                    <lightning-button-icon
                        icon-name="utility:expand_alt"
                        alternative-text="Open Popup"
                        onclick={openModal}
                        class="expand-button">
                    </lightning-button-icon>

                </div>
            </div>

            <!-- Main Chat Messages -->
            <div class="chatbot-message">

                <template for:each={message} for:item="message">

                    <div key={message.id}>

                        <div class={message.cssClass}>
                            {message.text}
                        </div>

                        <div class="message-time">
                            {message.time}
                        </div>

                    </div>

                </template>

            </div>

        </div>

    </div>

    <!-- Popup Modal -->
    <template if:true={showModal}>

        <div class="modal-backdrop">

            <div class="modal-container" onclick={handleModalClick}>

                <lightning-button-icon
                    icon-name="utility:close"
                    alternative-text="Close"
                    onclick={closeModal}
                    class="close-button">
                </lightning-button-icon>

                <div class="chatbot-header">
                    <div class="top-bar">

                        <img src={whatsappIcon}
                             alt="WhatsApp"
                             class="whatsapp-icon"/>

                        <span>{recordName}</span>

                    </div>
                </div>

                <div class="chatbot-message">

                    <template for:each={message} for:item="msg">

                        <div key={msg.id}>

                            <div class={msg.cssClass}>
                                {msg.text}
                            </div>

                            <div class="message-time">
                                {msg.time}
                            </div>

                        </div>

                    </template>

                </div>

            </div>

        </div>

    </template>

</template>
